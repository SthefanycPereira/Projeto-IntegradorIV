<h2>Situação do estoque</h2>

<p>Produto: {{ nomeProduto }}</p>

<p>Quantidade em estoque: {{ quantidadeEstoque }}</p>

<div *ngIf="quantidadeEstoque > 0">
  Produto disponível
</div>

<div *ngIf="quantidadeEstoque === 0">
  Produto sem estoque
</div>

<br>

<button (click)="adicionar()">
  Adicionar
</button>

<button
  (click)="remover()"
  [disabled]="quantidadeEstoque === 0">
  Remover
</button>
