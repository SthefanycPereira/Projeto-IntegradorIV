<b>Cadastro de Produto</b><br>

<label>Produto:</label>
<input type="text" [(ngModel)]="produto">

<br><br>

<label>Preço:</label>
<input type="number" [(ngModel)]="preco">

<br><br>

<label>Quantidade:</label>
<input type="number" [(ngModel)]="quantidade"><br><br>

<b>Resultado</b>

<p>Produto: {{ produto }}</p>

<p>Preço: R$ {{preco}}</p>

<p>Quantidade: {{ quantidade }}</p>

<p>Total: R$ {{ total }}</p>
